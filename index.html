<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>多源破解应用库</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="多源库">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f4f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 0.5rem; color: #1a202c; font-size: 14px; padding-top: env(safe-area-inset-top, 12px); line-height: 1.45; }
        button, a, input, textarea { touch-action: manipulation; }
        .container { max-width: 1200px; margin: 0 auto; }
        .app-header { text-align: center; margin-bottom: 18px; }
        .app-header h1 { font-size: 1.6rem; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
        .app-header h1 i { color: #f59e0b; }
        .app-sub { font-size: 0.75rem; color: #64748b; background: rgba(255,255,255,0.8); display: inline-block; padding: 4px 18px; border-radius: 20px; font-weight: 500; }
        .global-nav {
            position: sticky; top: env(safe-area-inset-top, 0); z-index: 100;
            display: flex; gap: 6px; align-items: center;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(16px);
            border-radius: 22px; padding: 8px 10px; margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04); transition: opacity 0.3s; will-change: opacity;
            -webkit-transform: translateZ(0); transform: translateZ(0);
        }
        .global-nav.transparent { opacity: 0.25; pointer-events: none; }
        .nav-btn { flex: 1; border: none; border-radius: 18px; padding: 12px 6px; color: white; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.15s; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; font-family: inherit; }
        .nav-btn:active { transform: scale(0.96); opacity: 0.9; }
        .nav-btn.disabled { opacity: 0.3; pointer-events: none; }
        .home-nav-btn { background: #f59e0b; }
        .back-btn, .forward-btn { background: #334155; }
        .refresh-btn { background: #3b82f6; }
        .source-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 14px; margin: 20px 0 24px; }
        .source-card { background: #fff; border-radius: 24px; padding: 16px 8px 14px; text-align: center; font-size: 0.85rem; font-weight: 700; color: #1e293b; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; }
        .source-card:active { transform: scale(0.94); background: #fafbfc; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        .source-icon { width: 46px; height: 46px; margin: 0 auto 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; }
        .app-card { display: flex; gap: 12px; background: #fff; border-radius: 22px; padding: 14px; border: 1px solid #f1f5f9; box-shadow: 0 8px 20px rgba(0,0,0,0.12); align-items: flex-start; margin-bottom: 12px; }
        .app-card .app-icon { width: 56px; height: 56px; border-radius: 18px; object-fit: cover; background: #f1f5f9; }
        .app-info { flex: 1; }
        .app-name { font-weight: 700; font-size: 0.95rem; }
        .btn { border: none; border-radius: 14px; padding: 6px 10px; font-size: 0.7rem; font-weight: 600; cursor: pointer; margin-right: 6px; margin-top: 4px; }
        .btn-download { background: #7c3aed; color: white; }
        .btn-copy-link { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
        .detail-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .detail-nav-btn { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 10px 18px; font-size: 0.95rem; font-weight: 700; }
        .disabled-source { background: #f1f5f9; color: #94a3b8; border: 2px solid #f59e0b; }
        .search-section { margin: 16px 0; background: #fff; border-radius: 22px; padding: 14px; }
        .search-input-wrapper input { width: 100%; border: 2px solid #e2e8f0; border-radius: 18px; padding: 12px; }
        .pagination { text-align: center; margin: 16px 0; }
        footer { margin-top: 24px; text-align: center; font-size: 0.65rem; color: #94a3b8; padding-bottom: 16px; }
        /* 弹窗样式省略，保持一致 */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 9999; visibility: hidden; opacity: 0; transition: 0.3s; }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-container { background: #fff; border-radius: 28px; width: 90%; max-width: 380px; padding: 28px 22px; text-align: center; }
        .download-modal-overlay { /* ... 同上 */ }
        .download-modal-overlay.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>
<div class="container">
    <div class="app-header">
        <h1><i class="fas fa-database"></i> 多源破解应用库</h1>
        <div class="app-sub">全局搜索 · 最新更新 · 独立源展示</div>
    </div>
    <div class="global-nav" id="globalNav">
        <button id="homeBtn" class="nav-btn home-nav-btn"><i class="fas fa-home"></i> 首页</button>
        <button id="backBtn" class="nav-btn back-btn"><i class="fas fa-arrow-left"></i></button>
        <button id="refreshBtn" class="nav-btn refresh-btn"><i class="fas fa-sync-alt"></i> 刷新</button>
        <button id="forwardBtn" class="nav-btn forward-btn"><i class="fas fa-arrow-right"></i></button>
    </div>
    <div id="mainContent"></div>
    <footer>一键下载 · 复制链接 · 历史导航支持</footer>
</div>

<div id="customModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header"><i class="fas fa-gem"></i><h3>💡 温馨提醒</h3></div>
        <div class="modal-body"><p>⚠️ 用户须仔细甄别下载需求类型，使用过程中产生的一切后果由用户自行负责！</p></div>
        <button id="modalConfirmBtn" class="modal-btn">已明白，开始探索</button>
    </div>
</div>

<script>
// 立即执行并全局捕获错误
(function() {
    console.log('🚀 脚本开始执行');
    const mainContent = document.getElementById('mainContent');
    if (!mainContent) {
        alert('致命错误：找不到 id="mainContent" 的容器，请检查 HTML');
        return;
    }
    console.log('✅ mainContent 容器已找到');

    const dataSources = [
        { name: "兮兮源", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/xixiyuan.json", banner: "破解应用，每日更新" },
        { name: "弟弟源", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/didiyuan.json", banner: "应用合集" },
        { name: "虫虫源", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/congcongyuan.json", banner: "精品小体积应用" },
        { name: "天嘻源", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/tianxiyuan.json", banner: "旧源，老源有很多能用的" },
        { name: "绅士黄油源", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/fulishenshiyuan.json", banner: "色色的全都有" },
        { name: "卡子源", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/kaziyuan.json", banner: "破解资源" },
        { name: "利特源", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/liteyuan.json", banner: "承诺更新快" },
        { name: "奔跑源", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/speedyuan.json", banner: "更新下载快" },
        { name: "游戏源", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/youxiyuan.json", banner: "游戏和手游：破解、内购" },
        { name: "外服游戏源", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/youxiyuan2.json", banner: "国外破解游戏" },
        { name: "更新中……", url: "https://raw.githubusercontent.com/hurui5423/hurui/main/wuxian.json", banner: "海量应用合集" }
    ];
    const sourceIcons = ['🎉','🍭','🐞','💡','😍','📀','🔌','🛞','🕹️','🐈‍⬛','♾️'];

    let allSourcesData = [];
    let historyStack = [];
    let currentStateIndex = -1;

    const globalNav = document.getElementById('globalNav');
    const homeBtn = document.getElementById('homeBtn');
    const backBtn = document.getElementById('backBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    function escapeHtml(s) { return s ? String(s).replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'>'?'&gt;') : ''; }
    function showToast(msg) {
        let el = document.createElement('div');
        el.innerText = msg;
        el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:8px 20px;border-radius:20px;z-index:10001;';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),2500);
    }

    // 数据加载（带重试提示）
    async function loadAllData() {
        console.log('📡 开始加载数据...');
        let successCount = 0;
        const proms = dataSources.map(async (s,i) => {
            try {
                let r = await fetch(s.url);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                let j = await r.json();
                let raw = j.apps || (Array.isArray(j) ? j : []);
                let apps = raw.map(a => ({
                    name: a.name||'未命名',
                    iconURL: a.iconURL||'',
                    version: a.version||'最新',
                    versionDescription: a.versionDescription||'',
                    downloadURL: a.downloadURL||'',
                    size: a.size||'0',
                    versionDate: a.versionDate||'',
                    type: a.type||0,
                    nameLower: (a.name||'').toLowerCase(),
                    descLower: (a.versionDescription||'').toLowerCase()
                })).filter(a => a.downloadURL);
                successCount++;
                console.log(`✅ ${s.name} 加载完成，${apps.length} 个应用`);
                return { name: s.name, idx: i, apps };
            } catch(e) {
                console.warn(`❌ ${s.name} 加载失败: ${e.message}`);
                return { name: s.name, idx: i, apps: [] };
            }
        });
        allSourcesData = await Promise.all(proms);
        console.log(`📊 数据加载完毕，成功 ${successCount}/${dataSources.length} 个源，总计 ${allSourcesData.reduce((a,b)=>a+b.apps.length,0)} 个应用`);
        if (successCount === 0) {
            showToast('⚠️ 所有数据源加载失败，请检查网络或开启 VPN');
        }
    }

    // 搜索（名称优先）
    function searchApps(kw) {
        if (!kw.trim()) return [];
        let k = kw.trim().toLowerCase();
        let res = [];
        for (let src of allSourcesData) {
            for (let a of src.apps) {
                let score = 0;
                if (a.nameLower === k) score = 100;
                else if (a.nameLower.startsWith(k)) score = 80;
                else if (a.nameLower.includes(k)) score = 60;
                if (a.descLower && a.descLower.includes(k)) score = Math.max(score, 40);
                if (score > 0) {
                    res.push({...a, sourceName: src.name, score});
                }
            }
        }
        res.sort((a,b) => b.score - a.score);
        return res;
    }

    function renderAppCard(app, showSource = true) {
        let cleanDl = app.downloadURL.replace(/\s/g, '%20');
        let tag = '';
        if (app.type === 10) tag = '⚡破解';
        else if (app.type === 2) tag = '🎮游戏';
        return `
            <div class="app-card">
                <img class="app-icon" src="${escapeHtml(app.iconURL)}" onerror="this.style.display='none'">
                <div class="app-info">
                    <div class="app-name">${escapeHtml(app.name)} ${tag}</div>
                    <div style="font-size:0.7rem;color:#475569;margin:4px 0;">${escapeHtml(app.versionDescription||'暂无介绍')}</div>
                    <div style="font-size:0.65rem;color:#94a3b8;">
                        ${showSource ? `<span style="color:#f59e0b;font-weight:600;">${escapeHtml(app.sourceName)}</span> ` : ''}
                        📱${escapeHtml(app.version)} 📅${app.versionDate||'未知'} 💾${app.size||'?'}
                    </div>
                    <div>
                        <button class="btn btn-download" data-url="${escapeHtml(cleanDl)}" data-name="${escapeHtml(app.name)}">⚡下载</button>
                        <button class="btn btn-copy-link" data-url="${escapeHtml(cleanDl)}" data-name="${escapeHtml(app.name)}">📋复制</button>
                    </div>
                </div>
            </div>`;
    }

    function bindButtons(container) {
        container.querySelectorAll('.btn-download').forEach(b => {
            b.addEventListener('click', () => {
                let url = b.dataset.url, name = b.dataset.name;
                if (url) {
                    const a = document.createElement('a');
                    a.href = url; a.target = '_blank'; a.download = name + '.ipa';
                    document.body.appendChild(a); a.click(); a.remove();
                    showToast('正在打开下载');
                }
            });
        });
        container.querySelectorAll('.btn-copy-link').forEach(b => {
            b.addEventListener('click', () => {
                let url = b.dataset.url;
                if (url) navigator.clipboard.writeText(url).then(() => showToast('链接已复制'));
            });
        });
    }

    // 渲染首页
    function renderHome(page = 1) {
        console.log('🏠 渲染首页');
        try {
            let all = [];
            for (let src of allSourcesData) {
                let sorted = [...src.apps].sort((a,b) => (b.versionDate||'').localeCompare(a.versionDate||''));
                sorted.slice(0,20).forEach(a => all.push({...a, sourceName: src.name}));
            }
            all.sort((a,b) => (b.versionDate||'').localeCompare(a.versionDate||''));
            let total = all.length;
            let perPage = 10;
            let data = all.slice((page-1)*perPage, page*perPage);

            let html = '<div class="source-grid">';
            dataSources.forEach((s,i) => {
                html += `<div class="source-card" data-idx="${i}"><div class="source-icon">${sourceIcons[i]}</div>${escapeHtml(s.name)}</div>`;
            });
            html += '</div>';

            html += `<div class="search-section">
                <input id="searchInput" placeholder="搜索应用名称..." value="">
                <button id="doSearchBtn">搜索</button>
            </div>`;

            if (total === 0) {
                html += `<div style="text-align:center;padding:40px;">📭 数据源暂不可用，请检查网络后点击“刷新”按钮</div>`;
            } else {
                html += `<div class="section-header">最近更新 (${total})</div><div id="appList">`;
                data.forEach(app => html += renderAppCard(app));
                html += `</div>`;
            }
            mainContent.innerHTML = html;

            document.querySelectorAll('.source-card').forEach(c => {
                c.addEventListener('click', () => navigateToSource(parseInt(c.dataset.idx)));
            });
            let si = document.getElementById('searchInput');
            document.getElementById('doSearchBtn').addEventListener('click', () => {
                if (si.value.trim()) navigateToSearch(si.value.trim());
            });
            bindButtons(mainContent);
        } catch(e) {
            console.error('renderHome 错误:', e);
            mainContent.innerHTML = '<div style="text-align:center;padding:40px;">渲染失败，请刷新</div>';
        }
    }

    function renderSourceDetail(idx, page = 1) {
        console.log('📂 渲染源详情', dataSources[idx].name);
        try {
            let src = allSourcesData[idx];
            let apps = src ? src.apps : [];
            let perPage = 24;
            let totalPages = Math.ceil(apps.length / perPage) || 1;
            let data = apps.slice((page-1)*perPage, page*perPage);

            let html = '<div class="detail-nav">';
            dataSources.forEach((s,i) => {
                if (i === idx) html += `<button class="detail-nav-btn disabled-source" disabled>${escapeHtml(s.name)}</button>`;
                else html += `<button class="detail-nav-btn" data-idx="${i}">${escapeHtml(s.name)}</button>`;
            });
            html += '</div>';
            html += `<h2>${escapeHtml(dataSources[idx].name)}</h2><p>${apps.length} 个应用</p>`;
            html += `<div class="search-section"><input id="searchInput" placeholder="搜索..."><button id="doSearchBtn">搜索</button></div>`;
            html += '<div id="appList">';
            data.forEach(a => html += renderAppCard(a, false));
            html += '</div>';
            mainContent.innerHTML = html;

            document.querySelectorAll('.detail-nav-btn:not(.disabled-source)').forEach(b => {
                b.addEventListener('click', () => navigateToSource(parseInt(b.dataset.idx)));
            });
            let si = document.getElementById('searchInput');
            document.getElementById('doSearchBtn').addEventListener('click', () => {
                if (si.value.trim()) navigateToSearch(si.value.trim());
            });
            bindButtons(mainContent);
        } catch(e) {
            console.error('renderSourceDetail 错误:', e);
            mainContent.innerHTML = '<div style="text-align:center;padding:40px;">渲染源失败</div>';
        }
    }

    function renderSearchResults(keyword) {
        console.log('🔍 渲染搜索结果', keyword);
        try {
            let results = searchApps(keyword);
            if (!results.length) {
                mainContent.innerHTML = '<div style="text-align:center;padding:40px;">未找到结果</div>';
                return;
            }
            let html = `<div class="search-section"><input id="searchInput" value="${escapeHtml(keyword)}"><button id="doSearchBtn">搜索</button></div>`;
            html += `<h3>搜索结果: ${keyword}</h3><div id="appList">`;
            results.forEach(app => html += renderAppCard(app, true));
            html += '</div>';
            mainContent.innerHTML = html;
            document.getElementById('doSearchBtn').addEventListener('click', () => {
                let kw = document.getElementById('searchInput').value;
                if (kw.trim()) navigateToSearch(kw.trim());
            });
            bindButtons(mainContent);
        } catch(e) {
            console.error('renderSearchResults 错误:', e);
            mainContent.innerHTML = '<div style="text-align:center;padding:40px;">搜索失败</div>';
        }
    }

    function navigateToHome() { pushState({mode:'home'}); }
    function navigateToSource(idx) { pushState({mode:'source', idx}); }
    function navigateToSearch(kw) { pushState({mode:'search', keyword: kw}); }

    function pushState(state) {
        historyStack = historyStack.slice(0, currentStateIndex+1);
        historyStack.push(state);
        currentStateIndex++;
        applyState(state);
        updateNav();
    }

    function applyState(s) {
        console.log('🎯 应用状态', s);
        if (s.mode === 'home') renderHome();
        else if (s.mode === 'source') renderSourceDetail(s.idx);
        else if (s.mode === 'search') renderSearchResults(s.keyword);
        // 弹窗省略
    }

    function updateNav() {
        backBtn.disabled = currentStateIndex <= 0;
        forwardBtn.disabled = currentStateIndex >= historyStack.length - 1;
    }

    // 导航栏透明控制
    let timer;
    function resetNav() {
        globalNav.classList.remove('transparent');
        clearTimeout(timer);
        timer = setTimeout(() => globalNav.classList.add('transparent'), 3000);
    }
    window.addEventListener('scroll', resetNav);
    window.addEventListener('touchstart', resetNav);
    timer = setTimeout(() => globalNav.classList.add('transparent'), 3000);

    // 初始化
    async function init() {
        console.log('⚙️ 开始初始化');
        await loadAllData();
        console.log('📦 数据加载完成，开始渲染首页');
        navigateToHome();
        homeBtn.addEventListener('click', navigateToHome);
        backBtn.addEventListener('click', () => {
            if (currentStateIndex > 0) {
                currentStateIndex--;
                applyState(historyStack[currentStateIndex]);
                updateNav();
            }
        });
        forwardBtn.addEventListener('click', () => {
            if (currentStateIndex < historyStack.length - 1) {
                currentStateIndex++;
                applyState(historyStack[currentStateIndex]);
                updateNav();
            }
        });
        refreshBtn.addEventListener('click', async () => {
            showToast('刷新中...');
            await loadAllData();
            applyState(historyStack[currentStateIndex]);
            showToast('刷新完成');
        });
        console.log('✅ 初始化完成');
    }

    init().catch(e => {
        console.error('💥 初始化致命错误:', e);
        mainContent.innerHTML = '<div style="text-align:center;padding:40px;">应用初始化失败，请查看控制台</div>';
    });
})();
</script>
</body>
</html>
